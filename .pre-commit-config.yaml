ci:
  skip:
    - prettier
    - prettier-jsonc
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: ".css.d.ts"
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: debug-statements
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.12.0-2
    hooks:
      - id: shfmt
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.37.1
    hooks:
      - id: yamllint
        args: [--format, parsable, -d, relaxed]
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args:
          - --baseline
          - .secrets.baseline
        # Generated API clients are not hand-written and hold no real secrets;
        # the generator's `common.ts` trips the apiKey keyword heuristic and its
        # line numbers churn the baseline on every regeneration. Skip them.
        exclude: ^packages/api/src/generated
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.14.10"
    hooks:
      - id: ruff-format
      - id: ruff
        args: [--extend-ignore=D1, --fix]
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: ["--severity=warning"]
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx prettier --write --no-error-on-unmatched-pattern
        language: node
        types_or:
          [
            javascript,
            jsx,
            ts,
            tsx,
            json,
            scss,
            sass,
            css,
            yaml,
            markdown,
            html,
          ]
      # `identify`, which supplies pre-commit's `types_or` tags, has no `jsonc`
      # tag (it reports no tags at all for a .jsonc filename), so .jsonc files
      # have to be selected by name. `files` and `types_or` are ANDed, hence a
      # separate hook rather than another entry in the list above. Prettier
      # also fails on unparseable JSONC, so this doubles as a syntax check —
      # `check-json` cannot be used here, as it rejects comments.
      - id: prettier-jsonc
        name: prettier (jsonc)
        entry: npx prettier --write --no-error-on-unmatched-pattern
        language: node
        files: \.jsonc$
