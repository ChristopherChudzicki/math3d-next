# Online zizmor audits (known-vulnerable-actions, impostor-commit, ...), which the offline
# pre-commit hook skips. Dependabot raises no alerts for SHA-pinned actions, so the weekly
# run is what surfaces newly disclosed advisories.
name: CI/ zizmor

on:
  pull_request:
    paths:
      - ".github/**"
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          # Fail the job on findings rather than only uploading them to code scanning.
          advanced-security: false
          min-severity: medium
