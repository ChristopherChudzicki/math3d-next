name: CI/ End-to-end Tests

on:
  push:
    branches: [main]
  # No `branches` filter: a stacked PR targets its parent feature branch, and
  # these checks must run there too.
  pull_request:

permissions:
  contents: read

env:
  CI: True

jobs:
  e2e-tests:
    timeout-minutes: 60
    # Pinned to 24.04 (not 26.04 like the other jobs) because Playwright 1.57
    # can't install browser deps on ubuntu-26.04-x64 yet. The backend under test
    # runs in Docker, so this runner's OS has no Heroku-parity relevance. Bump to
    # ubuntu-26.04 once a Playwright release supports it.
    runs-on: ubuntu-24.04
    environment: "ci"
    env:
      SKIP_YARN_COREPACK_CHECK: true
      VITE_APP_VERSION: ci
      VITE_DISPLAY_AUTH_FLOWS: "true"
      VITE_ENABLE_DUMMY_AUTH: "true"
      VITE_LEGACY_APP_BASE_URL: ${{ vars.VITE_LEGACY_APP_BASE_URL }}
      VITE_ISSUE_URL: ${{ vars.VITE_ISSUE_URL }}
      TEST_USER_STATIC_EMAIL: ${{ vars.TEST_USER_STATIC_EMAIL }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      # The app/API origins must agree with the backend's ALLOWED_HOSTS default
      # and CSRF_COOKIE_DOMAIN, so take them from the committed dev config
      # rather than GitHub variables that can drift from it.
      - name: Load local origins from .env.development
        run: grep -E '^(APP_BASE_URL|VITE_API_BASE_URL|VITE_SITE_ORIGIN|TEST_API_URL|TEST_APP_URL)=' .env.development >> "$GITHUB_ENV"
      # Chromium resolves *.localhost itself; Node goes through the system
      # resolver, so pin the names rather than rely on the runner's.
      - name: Add local domain entries to /etc/hosts
        run: |
          APP_HOST=$(echo "$TEST_APP_URL" | sed -E 's|https?://||; s|:[0-9]+$||')
          API_HOST=$(echo "$TEST_API_URL" | sed -E 's|https?://||; s|:[0-9]+$||')
          echo "127.0.0.1 $APP_HOST $API_HOST" | sudo tee -a /etc/hosts
          echo "::1       $APP_HOST $API_HOST" | sudo tee -a /etc/hosts
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: ".nvmrc"
          cache: "yarn"
      - run: corepack enable
      - name: Write env file for docker
        run: |
          {
            echo "VITE_APP_VERSION=$VITE_APP_VERSION"
            echo "VITE_LEGACY_APP_BASE_URL=$VITE_LEGACY_APP_BASE_URL"
            echo "TEST_USER_STATIC_EMAIL=$TEST_USER_STATIC_EMAIL"
            echo "DISABLE_ALLAUTH_RATE_LIMITS=true"
          } >> .env
      - name: Build docker stack
        run: docker compose build
      - name: Migrate backend database
        run: docker compose run --rm webserver uv run ./manage.py migrate
      - name: Seed database
        run: docker compose run --rm webserver uv run ./manage.py seed_test_data
      - name: Start docker stack
        run: docker compose up -d
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build Frontend
        run: yarn build
      # The frontend is served by Playwright's webServer config (`yarn preview`
      # in CI), which waits for the URL to be ready before running tests.
      - name: Install Playwright Browsers
        run: yarn workspace app-tests-e2e playwright install --with-deps
      - name: Run Playwright tests
        run: yarn test-e2e
        env:
          CI: True
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: packages/app-tests-e2e/playwright-report/
          retention-days: 30
