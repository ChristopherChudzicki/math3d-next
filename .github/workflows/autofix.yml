# Runs the hooks in .pre-commit-config.yaml with prek and pushes whatever they fix back to
# the PR via the autofix.ci GitHub App. The App identifies this workflow by its name, so
# the name must stay exactly `autofix.ci`.
name: autofix.ci

on:
  # No `branches` filter: a stacked PR targets its parent feature branch, and
  # these checks must run there too.
  pull_request:

permissions:
  contents: read

jobs:
  autofix:
    runs-on: ubuntu-26.04
    env:
      SKIP_YARN_COREPACK_CHECK: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      # The prettier hooks run the repo's own prettier from node_modules.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: ".nvmrc"
          cache: "yarn"
      - run: corepack enable
      - run: yarn install --immutable
      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          install-only: true
      # prek exits non-zero when a hook modifies files, so a fixable failure is let through
      # and a second run decides whether anything unfixable remains.
      - name: Run prek
        id: prek
        continue-on-error: true
        run: prek run --all-files --show-diff-on-failure
      - name: Verify fixes
        if: steps.prek.outcome == 'failure'
        run: prek run --all-files --show-diff-on-failure
      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
        if: ${{ !cancelled() }}
