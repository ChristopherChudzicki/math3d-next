name: 🔒 _reusable deploy

on:
  workflow_call:
    inputs:
      environment:
        description: "Environment to deploy to (rc or production)"
        required: true
        type: string
      version:
        description: "Version number to deploy"
        required: true
        type: string
      # Only the checkouts use this; the workflow file itself runs from the caller's commit.
      ref:
        description: "Fully-qualified ref to build and deploy (the release's tag, refs/tags/...)"
        required: true
        type: string
      dry_run:
        description: "If true, build artifacts but skip deployment"
        required: false
        type: boolean
        default: false
    secrets:
      HEROKU_API_KEY:
        required: true
      CLOUDFLARE_API_TOKEN:
        # Only used for production; rc builds don't deploy.
        required: false
      SENTRY_ORG_TOKEN:
        # Source-map upload for the SPA; must be a Sentry org auth token
        # (`sntrys_`), which carries its own org. Absent ⇒ the Vite plugin is
        # skipped and the build still succeeds (rc dry runs and forks).
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # Before setup-node, so `cache: yarn` sees Yarn 4 rather than the runner's Yarn 1.
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: ".nvmrc"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build frontend
        run: yarn build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_LEGACY_APP_BASE_URL: ${{ vars.VITE_LEGACY_APP_BASE_URL }}
          VITE_ISSUE_URL: ${{ vars.VITE_ISSUE_URL }}
          VITE_DISPLAY_AUTH_FLOWS: ${{ vars.VITE_DISPLAY_AUTH_FLOWS }}
          VITE_SITE_ORIGIN: ${{ vars.VITE_SITE_ORIGIN }}
          VITE_APP_VERSION: ${{ inputs.version }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          SENTRY_ORG_TOKEN: ${{ secrets.SENTRY_ORG_TOKEN }}
          # Required whenever the token is set; the build fails without it.
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.dry_run && format('frontend-build-{0}', inputs.version) || 'frontend-build' }}
          path: packages/app/dist/
          retention-days: ${{ inputs.dry_run && 30 || 1 }}

  deploy-heroku:
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-26.04
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Install Heroku CLI
        run: |
          curl https://cli-assets.heroku.com/install.sh | sh

      - name: Deploy to Heroku
        uses: akhileshns/heroku-deploy@1b080913896a5d6d44a18e9e208f8eb1fee9b0f7 # v3.15.15
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: ${{ vars.HEROKU_APP_NAME }}
          heroku_email: ${{ vars.HEROKU_EMAIL }}
        env:
          HD_APP_VERSION: ${{ inputs.version }}

  deploy-cloudflare:
    needs: build
    if: ${{ !inputs.dry_run && inputs.environment == 'production' }}
    runs-on: ubuntu-26.04
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # Before setup-node, so `cache: yarn` sees Yarn 4 rather than the runner's Yarn 1.
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: ".nvmrc"
          cache: "yarn"

      # Install with yarn, not npm: this is a Yarn-workspaces monorepo whose
      # package.json files use the `workspace:` protocol, which npm can't parse
      # (cloudflare/wrangler-action's own `npm i wrangler` fails with
      # EUNSUPPORTEDPROTOCOL here). Running the workspace-pinned wrangler is also
      # the single source of truth for the version — no duplicated version string.
      - name: Install dependencies
        run: yarn install --immutable

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-build
          path: packages/app/dist/

      # Reuse the build's VITE_* vars so the Worker values can't drift from the
      # static head. SCREENSHOTS_ORIGIN may be empty (feature dark); the other
      # two are required, so fail loudly rather than ship an empty binding.
      - name: Deploy to Cloudflare Workers
        working-directory: packages/app
        run: |
          [ -n "$API_BASE" ] && [ -n "$SITE_ORIGIN" ] || { echo "::error::API_BASE and SITE_ORIGIN must be set (GitHub Actions variables VITE_API_BASE_URL / VITE_SITE_ORIGIN)"; exit 1; }
          yarn wrangler deploy \
            --var API_BASE:"$API_BASE" \
            --var SITE_ORIGIN:"$SITE_ORIGIN" \
            --var SCREENSHOTS_ORIGIN:"$SCREENSHOTS_ORIGIN"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          API_BASE: ${{ vars.VITE_API_BASE_URL }}
          SITE_ORIGIN: ${{ vars.VITE_SITE_ORIGIN }}
          SCREENSHOTS_ORIGIN: ${{ vars.SCREENSHOTS_ORIGIN }}

      # CI checks the policy against `vite preview`, which can't tell whether
      # Cloudflare sends it, so check the live site.
      - name: Verify the deployed site sends its Content-Security-Policy
        run: |
          for _ in 1 2 3 4 5; do
            curl -fsSI "$SITE_ORIGIN/" | grep -qi '^content-security-policy:' && exit 0
            sleep 10
          done
          echo "::error::$SITE_ORIGIN/ sends no Content-Security-Policy header"
          exit 1
        env:
          SITE_ORIGIN: ${{ vars.VITE_SITE_ORIGIN }}

  # Experimental, var-gated (SCREENSHOTS_ORIGIN) render Worker — deployed in its OWN
  # job, in PARALLEL with the app deploy, and marked continue-on-error so it can
  # NEVER gate the core app's ship path. The feature is dark until the
  # SCREENSHOTS_ORIGIN GitHub Actions variable is set (injected into the app
  # Worker via --var above), and its infra (R2 bucket, Browser Rendering
  # entitlement, token scopes) is provisioned out-of-band — so until then this
  # step is expected to fail harmlessly. When the feature graduates, drop
  # continue-on-error so real regressions surface. See packages/screenshots/README.md.
  deploy-screenshots:
    needs: build
    if: ${{ !inputs.dry_run && inputs.environment == 'production' }}
    runs-on: ubuntu-26.04
    environment: ${{ inputs.environment }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # Before setup-node, so `cache: yarn` sees Yarn 4 rather than the runner's Yarn 1.
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: ".nvmrc"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Deploy screenshots render Worker
        working-directory: packages/screenshots
        run: |
          [ -n "$FRAME_ORIGIN" ] || { echo "::error::FRAME_ORIGIN must be set (GitHub Actions variable VITE_SITE_ORIGIN)"; exit 1; }
          yarn wrangler deploy --var FRAME_ORIGIN:"$FRAME_ORIGIN"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          FRAME_ORIGIN: ${{ vars.VITE_SITE_ORIGIN }}
